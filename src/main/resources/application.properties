spring.application.name=gerenciador-produtos

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/gerenciador_produtos
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/gerenciador_produtos?replicaSet=rs0
